name: Clasificar despliegue ASODELTOL

on:
  push:
    branches: [main]
    paths:
      - 'plugins/theme/rsmax/**'
      - 'plugins/local/asodeltolstaff/**'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: asodeltol-deployment-classification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Clasificar cambios publicados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener commits necesarios
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clasificar riesgo sin bloquear la ruta rápida
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.before }}'
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          node scripts/deploy/classify-changes.mjs --base "$base" --head '${{ github.sha }}' | tee deployment-classification.json
          node -e "const p=require('./deployment-classification.json'); console.log('risk=' + p.risk + ' deployable=' + p.deployable + ' manual=' + p.manualRequired)"

      - name: Conservar clasificación
        uses: actions/upload-artifact@v4
        with:
          name: deployment-classification-${{ github.sha }}
          path: deployment-classification.json
          retention-days: 7
