name: Calidad ASODELTOL

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-and-repository:
    name: Catalogo y seguridad del repositorio
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar catalogo y ejecutar pruebas
        run: npm run quality

      - name: Validar archivos y exclusiones
        shell: powershell
        run: .\scripts\quality\validate-repository.ps1
