# OPTIONAL; copy into the EXISTING HTTPS server{} of aulaasodeltol.online only.
# Back up the Vhost and run nginx -t. No automatic configuration changes.
location = /__asodeltol_diag/mcp {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8766/mcp;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_cache off;
    access_log off;
}

# Optional GPT Actions alternative for accounts that cannot add custom MCP.
location ~ ^/__asodeltol_diag/v1/(system|versions|uploads|deploy)$ {
    limit_except GET { deny all; }
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_cache off;
    access_log off;
}
